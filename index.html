<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annual Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1621; --surface:#16212C; --surface-2:#1C2A38; --border:#263646;
  --text:#EAF1F6; --muted:#8CA0B3; --faint:#54677A;
  --accent:#33C6B0; --accent-soft:#33C6B01f;
  --holiday:#E0954B; --holiday-soft:#E0954B26;
  --danger:#E06B6B;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,sans-serif;
  min-height:100%;
}
::selection{background:var(--accent-soft);}

header{
  position:sticky; top:0; z-index:20;
  padding:env(safe-area-inset-top,0px) 0 0;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.topbar{
  max-width:1180px; margin:0 auto; padding:18px 24px 14px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.brand h1{
  font-family:'Space Grotesk'; font-size:22px; font-weight:700; margin:0; letter-spacing:-.01em; color:var(--text);
}
.brand span{color:var(--muted); font-size:13px;}
.controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}
.year-nav{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.year-nav button{
  width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:16px; cursor:pointer; line-height:1;
}
.year-nav button:hover{background:var(--surface-2);}
.year-nav .year{font-family:'Space Grotesk'; font-size:17px; font-weight:600; min-width:52px; text-align:center; color:var(--text);}
.month-nav{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.month-nav button{
  width:30px; height:30px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:15px; cursor:pointer; line-height:1;
}
.month-nav button:hover{background:var(--surface-2);}
.month-select{
  font-family:'Space Grotesk'; font-size:14px; font-weight:600; text-align:center;
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:9px; padding:6px 8px; cursor:pointer; color-scheme:dark;
}
.month-select option{background:var(--surface); color:var(--text);}
.view-toggle{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; flex-shrink:0;}
.view-toggle button{
  border:none; background:var(--surface); color:var(--muted); padding:7px 12px; font-size:12.5px;
  cursor:pointer; font-family:'Inter'; font-weight:600;
}
.view-toggle button.active{background:var(--accent); color:#08211D;}
.today-btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  padding:7px 13px; border-radius:10px; font-size:13px; cursor:pointer; font-family:'Inter'; flex-shrink:0;
}
.today-btn:hover{background:var(--surface-2);}
.legend{max-width:1180px; margin:0 auto; padding:0 24px 12px; display:flex; gap:18px; font-size:12px; color:var(--muted); flex-wrap:wrap;}
.legend .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:middle;}
.dot.h{background:var(--holiday);}
.dot.e{background:var(--accent);}

@media (max-width:760px){
  .topbar{flex-direction:column; align-items:stretch; padding:14px 16px 10px; gap:10px;}
  .brand h1{font-size:18px;}
  .controls{justify-content:space-between; width:100%; gap:8px;}
  .year-nav{order:2;}
  .view-toggle{order:1;}
  .today-btn{order:3; margin-left:auto;}
  .month-nav{order:4; width:100%; justify-content:center; padding-top:4px; border-top:1px solid var(--border); margin-top:2px;}
  .legend{padding:0 16px 10px; font-size:11px; gap:10px;}
  .legend span:last-child{display:none;}
}

main{max-width:1180px; margin:0 auto; padding:8px 24px 60px;}
@media (max-width:640px){ main{padding:8px 16px 48px;} }
.grid{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:16px;
}
@media (max-width:920px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:560px){ .grid{grid-template-columns:1fr;} }

.month{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 14px 10px;
}
.month h2{
  font-family:'Space Grotesk'; font-size:14.5px; font-weight:600; margin:0 0 10px; letter-spacing:.01em;
}
.dow{
  display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px;
}
.dow span{
  font-size:10px; color:var(--faint); text-align:center; font-weight:600; letter-spacing:.03em;
}
.days{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
.day{
  position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  font-size:12px; border-radius:8px; cursor:pointer; color:var(--text); user-select:none;
}
.day:hover{background:var(--surface-2);}
.day.empty{cursor:default;}
.day.empty:hover{background:none;}
.day.weekend{color:var(--muted);}
.day.holiday{background:var(--holiday-soft); color:var(--holiday); font-weight:600;}
.day.today{outline:1.5px solid var(--accent); font-weight:700;}
.day .mark{
  position:absolute; bottom:3px; display:flex; gap:2px;
}
.day .mark i{width:3.5px; height:3.5px; border-radius:50%; display:block;}
.day .mark i.h{background:var(--holiday);}
.day .mark i.e{background:var(--accent);}
.day.tagged{color:#0B1015;}
.day.tagged.weekend{color:#0B1015;}

/* Single-month view */
.month-view .grid{display:block;}
.month-view .month{padding:20px 20px 14px; max-width:640px; margin:0 auto;}
.month-view .month h2{display:none;}
.month-view .dow span{font-size:11.5px;}
.month-view .day{
  aspect-ratio:auto; height:72px; border-radius:10px; align-items:flex-start; justify-content:flex-start;
  flex-direction:column; padding:7px 8px; font-size:13px; font-weight:600; gap:4px;
}
.month-view .day .note-preview{
  font-size:10.5px; font-weight:400; color:var(--muted); line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  width:100%;
}
.month-view .day.tagged .note-preview{color:#0B1015; opacity:.75;}
.month-view .day .mark{position:static; margin-top:auto;}
.grid.hidden{display:none;}

@media (max-width:480px){
  .month-view .month{padding:14px 12px 10px;}
  .month-view .day{height:58px; font-size:12px; padding:5px 6px;}
  .month-view .day .note-preview{font-size:9.5px;}
}

footer{
  max-width:1180px; margin:0 auto; padding:10px 24px calc(28px + env(safe-area-inset-bottom,0px));
  color:var(--faint); font-size:12px; text-align:center; border-top:1px solid var(--border); padding-top:18px;
}
footer b{color:var(--muted); font-weight:600;}

/* Side panel */
.overlay{
  position:fixed; inset:0; background:rgba(6,10,14,.55); backdrop-filter:blur(2px);
  opacity:0; pointer-events:none; transition:opacity .18s ease; z-index:30;
}
.overlay.open{opacity:1; pointer-events:auto;}
.panel{
  position:fixed; top:0; right:0; height:100%; width:380px; max-width:92vw;
  background:var(--surface); border-left:1px solid var(--border);
  padding:env(safe-area-inset-top,0px) 22px env(safe-area-inset-bottom,0px);
  transform:translateX(100%); transition:transform .22s ease; z-index:31;
  display:flex; flex-direction:column;
}
.panel.open{transform:translateX(0);}
.panel-head{display:flex; justify-content:space-between; align-items:flex-start; padding-top:22px;}
.panel-date{font-family:'Space Grotesk'; font-size:20px; font-weight:700;}
.panel-sub{color:var(--muted); font-size:12.5px; margin-top:2px;}
.close-btn{
  width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); cursor:pointer; font-size:15px; flex-shrink:0;
}
.holiday-tag{
  display:inline-block; margin-top:12px; padding:5px 10px; border-radius:8px;
  background:var(--holiday-soft); color:var(--holiday); font-size:12.5px; font-weight:600;
}
.swatches{display:flex; gap:9px; margin-top:16px; flex-wrap:wrap; align-items:center;}
.swatch{
  width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent;
  transition:transform .12s ease;
}
.swatch:hover{transform:scale(1.1);}
.swatch.selected{border-color:var(--text); box-shadow:0 0 0 2px var(--surface);}
.swatch.none{
  background:var(--surface-2); border:1px solid var(--border); position:relative;
}
.swatch.none::after{
  content:''; position:absolute; left:4px; right:4px; top:50%; height:1.5px; background:var(--danger); transform:rotate(45deg);
}
.panel textarea{
  margin-top:18px; flex:1; min-height:160px; resize:vertical; width:100%;
  background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
  color:var(--text); font-family:'Inter'; font-size:14px; padding:12px; line-height:1.5;
}
.panel textarea:focus{outline:1.5px solid var(--accent); border-color:transparent;}
.panel-actions{display:flex; gap:10px; margin:16px 0 24px;}
.panel-actions button{
  flex:1; padding:11px; border-radius:10px; border:1px solid var(--border);
  font-family:'Inter'; font-size:13.5px; font-weight:600; cursor:pointer;
}
.save-btn{background:var(--accent); color:#08211D; border-color:var(--accent);}
.save-btn:hover{filter:brightness(1.08);}
.del-btn{background:transparent; color:var(--danger); border-color:var(--border);}
.del-btn:hover{background:#E06B6B14;}
.saved-flash{color:var(--accent); font-size:12px; height:14px; margin-top:6px; opacity:0; transition:opacity .2s;}
.saved-flash.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand"><h1>Annual Planner</h1><span>Notes &amp; holidays for every day of the year</span></div>
    <div class="controls">
      <div class="view-toggle">
        <button id="viewYear" class="active">Year</button>
        <button id="viewMonth">Month</button>
      </div>
      <div class="year-nav">
        <button id="prevYear" aria-label="Previous year">‹</button>
        <div class="year" id="yearLabel"></div>
        <button id="nextYear" aria-label="Next year">›</button>
      </div>
      <button class="today-btn" id="todayBtn">Today</button>
      <div class="month-nav" id="monthNav" style="display:none;">
        <button id="prevMonth" aria-label="Previous month">‹</button>
        <select class="month-select" id="monthSelect"></select>
        <button id="nextMonth" aria-label="Next month">›</button>
      </div>
    </div>
  </div>
  <div class="legend">
    <span><i class="dot h"></i>Public holiday</span>
    <span><i class="dot e"></i>Has note</span>
    <span>Coloured days mark whatever you tag them with</span>
  </div>
</header>

<main><div class="grid" id="grid"></div></main>

<footer>Developed by <b>M. Atiq ur Rehman</b>, Assistant Electric Inspector, Gujranwala</footer>

<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <div>
      <div class="panel-date" id="panelDate"></div>
      <div class="panel-sub" id="panelSub"></div>
    </div>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>
  <div id="holidayTag"></div>
  <div class="swatches" id="swatches"></div>
  <textarea id="noteText" placeholder="Add a note, task or reminder for this day…"></textarea>
  <div class="saved-flash" id="savedFlash">Saved</div>
  <div class="panel-actions">
    <button class="del-btn" id="delBtn">Clear</button>
    <button class="save-btn" id="saveBtn">Save</button>
  </div>
</div>

<script>
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["S","M","T","W","T","F","S"];

// Fixed-date national holidays (recur every year)
const FIXED_HOLIDAYS={
  "01-01":"New Year's Day",
  "02-05":"Kashmir Solidarity Day",
  "03-23":"Pakistan Day",
  "05-01":"Labour Day",
  "08-14":"Independence Day",
  "11-09":"Iqbal Day",
  "12-25":"Quaid-e-Azam Day / Christmas"
};

// Islamic (lunar) holidays — confirmed only close to the date via moon sighting.
// Filled in for years where an official/expected notification is available; add more as they're announced.
const LUNAR_HOLIDAYS={
  2026:{
    "03-20":"Eid-ul-Fitr Holiday","03-21":"Eid-ul-Fitr","03-22":"Eid-ul-Fitr Holiday",
    "05-27":"Eid-ul-Azha","05-28":"Eid-ul-Azha / Youm-e-Takbeer","05-29":"Eid-ul-Azha Holiday",
    "06-24":"Ashura","06-25":"Ashura Holiday","06-26":"Ashura",
    "08-25":"Eid Milad-un-Nabi"
  }
};

function holidayFor(y,m,d){
  const key=String(m+1).padStart(2,'0')+"-"+String(d).padStart(2,'0');
  if(LUNAR_HOLIDAYS[y] && LUNAR_HOLIDAYS[y][key]) return LUNAR_HOLIDAYS[y][key];
  if(FIXED_HOLIDAYS[key]) return FIXED_HOLIDAYS[key];
  return null;
}

const COLORS=["#E06B6B","#E0954B","#E6C84F","#5FBF6B","#33C6B0","#4FA6E0","#8B7FE0","#E06BC0"];

let entries={};
try{
  const stored=localStorage.getItem('planner-entries');
  if(stored){
    const parsed=JSON.parse(stored);
    // migrate old plain-string format {date: "note"} to {date:{note,color}}
    Object.keys(parsed).forEach(k=>{
      entries[k]= typeof parsed[k]==='string' ? {note:parsed[k], color:null} : parsed[k];
    });
  }
}catch(e){}

function persist(){
  try{ localStorage.setItem('planner-entries', JSON.stringify(entries)); }catch(e){}
}

const now=new Date();
let currentYear=now.getFullYear();
let currentMonth=now.getMonth();
let view='year';
let activeDateKey=null;
let pendingColor=null;

function dateKey(y,m,d){ return y+"-"+String(m+1).padStart(2,'0')+"-"+String(d).padStart(2,'0'); }

const monthSelect=document.getElementById('monthSelect');
MONTHS.forEach((mo,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=mo; monthSelect.appendChild(o); });

function buildMonthCard(y,m,big){
  const first=new Date(y,m,1);
  const daysInMonth=new Date(y,m+1,0).getDate();
  const startDow=first.getDay();

  const card=document.createElement('div');
  card.className='month';
  const h2=document.createElement('h2'); h2.textContent=MONTHS[m]; card.appendChild(h2);

  const dow=document.createElement('div'); dow.className='dow';
  DOW.forEach(d=>{const s=document.createElement('span'); s.textContent=d; dow.appendChild(s);});
  card.appendChild(dow);

  const days=document.createElement('div'); days.className='days';
  for(let i=0;i<startDow;i++){ const e=document.createElement('div'); e.className='day empty'; days.appendChild(e); }

  for(let d=1; d<=daysInMonth; d++){
    const cell=document.createElement('div');
    const dow_i=(startDow+d-1)%7;
    const isWeekend = dow_i===0 || dow_i===6;
    const holiday=holidayFor(y,m,d);
    const key=dateKey(y,m,d);
    const entry=entries[key];
    const hasNote = !!(entry && entry.note && entry.note.trim());
    const color = entry && entry.color;
    const isToday = y===now.getFullYear() && m===now.getMonth() && d===now.getDate();

    cell.className='day'+(isWeekend?' weekend':'')+(holiday?' holiday':'')+(isToday?' today':'')+(color?' tagged':'');
    if(color) cell.style.background=color;
    cell.dataset.key=key;

    const num=document.createElement('span'); num.textContent=d;
    cell.appendChild(num);

    if(big && hasNote){
      const prev=document.createElement('div'); prev.className='note-preview'; prev.textContent=entry.note;
      cell.appendChild(prev);
    }

    if(holiday || hasNote){
      const mark=document.createElement('div'); mark.className='mark';
      if(holiday){ const i=document.createElement('i'); i.className='h'; mark.appendChild(i); }
      if(hasNote){ const i=document.createElement('i'); i.className='e'; if(color) i.style.background=color; mark.appendChild(i); }
      cell.appendChild(mark);
    }
    cell.addEventListener('click',()=>openPanel(y,m,d));
    days.appendChild(cell);
  }
  card.appendChild(days);
  return card;
}

function render(){
  document.getElementById('yearLabel').textContent=currentYear;
  monthSelect.value=currentMonth;
  document.body.classList.toggle('month-view', view==='month');
  document.getElementById('monthNav').style.display = view==='month' ? 'flex' : 'none';

  const grid=document.getElementById('grid');
  grid.innerHTML='';
  if(view==='year'){
    for(let m=0;m<12;m++) grid.appendChild(buildMonthCard(currentYear,m,false));
  }else{
    grid.appendChild(buildMonthCard(currentYear,currentMonth,true));
  }
}

const overlay=document.getElementById('overlay');
const panel=document.getElementById('panel');
const noteText=document.getElementById('noteText');
const savedFlash=document.getElementById('savedFlash');

const swatchesEl=document.getElementById('swatches');
function buildSwatches(selected){
  swatchesEl.innerHTML='';
  const none=document.createElement('div');
  none.className='swatch none'+(!selected?' selected':'');
  none.title='No colour';
  none.addEventListener('click',()=>{ pendingColor=null; buildSwatches(null); });
  swatchesEl.appendChild(none);
  COLORS.forEach(c=>{
    const s=document.createElement('div');
    s.className='swatch'+(selected===c?' selected':'');
    s.style.background=c;
    s.addEventListener('click',()=>{ pendingColor=c; buildSwatches(c); });
    swatchesEl.appendChild(s);
  });
}

function openPanel(y,m,d){
  activeDateKey=dateKey(y,m,d);
  const dt=new Date(y,m,d);
  document.getElementById('panelDate').textContent=dt.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('panelSub').textContent=dt.toLocaleDateString('en-GB',{weekday:'long'});
  const holiday=holidayFor(y,m,d);
  const tagEl=document.getElementById('holidayTag');
  tagEl.innerHTML = holiday ? '<span class="holiday-tag">'+holiday+'</span>' : '';
  const entry=entries[activeDateKey];
  noteText.value = (entry && entry.note) || '';
  pendingColor = (entry && entry.color) || null;
  buildSwatches(pendingColor);
  savedFlash.classList.remove('show');
  overlay.classList.add('open'); panel.classList.add('open');
  setTimeout(()=>noteText.focus(),200);
}
function closePanel(){
  overlay.classList.remove('open'); panel.classList.remove('open');
  activeDateKey=null;
}
document.getElementById('closeBtn').addEventListener('click',closePanel);
overlay.addEventListener('click',closePanel);

document.getElementById('saveBtn').addEventListener('click',()=>{
  if(!activeDateKey) return;
  const val=noteText.value;
  if(val.trim() || pendingColor) entries[activeDateKey]={note:val, color:pendingColor};
  else delete entries[activeDateKey];
  persist(); render();
  savedFlash.classList.add('show');
  setTimeout(()=>savedFlash.classList.remove('show'),1200);
});
document.getElementById('delBtn').addEventListener('click',()=>{
  if(!activeDateKey) return;
  delete entries[activeDateKey]; noteText.value=''; pendingColor=null; buildSwatches(null);
  persist(); render();
});

document.getElementById('prevYear').addEventListener('click',()=>{currentYear--; render();});
document.getElementById('nextYear').addEventListener('click',()=>{currentYear++; render();});
document.getElementById('todayBtn').addEventListener('click',()=>{
  currentYear=now.getFullYear(); currentMonth=now.getMonth(); render();
  document.querySelector('.day.today')?.scrollIntoView({behavior:'smooth',block:'center'});
});

document.getElementById('prevMonth').addEventListener('click',()=>{
  currentMonth--; if(currentMonth<0){currentMonth=11; currentYear--;} render();
});
document.getElementById('nextMonth').addEventListener('click',()=>{
  currentMonth++; if(currentMonth>11){currentMonth=0; currentYear++;} render();
});
monthSelect.addEventListener('change',()=>{ currentMonth=parseInt(monthSelect.value,10); render(); });

const viewYearBtn=document.getElementById('viewYear');
const viewMonthBtn=document.getElementById('viewMonth');
viewYearBtn.addEventListener('click',()=>{ view='year'; viewYearBtn.classList.add('active'); viewMonthBtn.classList.remove('active'); render(); });
viewMonthBtn.addEventListener('click',()=>{ view='month'; viewMonthBtn.classList.add('active'); viewYearBtn.classList.remove('active'); render(); });

render();
</script>
</body>
</html>
